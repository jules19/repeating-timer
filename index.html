<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice Timer">
<meta name="theme-color" content="#141420">
<title>Practice Timer</title>
<style>
  :root {
    --bg: #141420;
    --bg2: #1d1d2e;
    --card: #22223a;
    --ink: #f2f0ea;
    --muted: #9a97b0;
    --accent: #e8b04b;
    --accent-soft: rgba(232, 176, 75, 0.16);
    --ring-track: #2e2e48;
    --good: #7fc8a9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  header { text-align: center; }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #cycle {
    margin-top: 6px;
    font-size: 15px;
    color: var(--accent);
    font-weight: 500;
    min-height: 20px;
    transition: opacity 0.3s;
  }

  /* ---- dial ---- */
  #dialWrap {
    position: relative;
    width: min(78vw, 46dvh, 380px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #dial { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #dial circle { fill: none; stroke-width: 7; }
  #track { stroke: var(--ring-track); }
  #progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.3s;
  }
  #timeText {
    font-variant-numeric: tabular-nums;
    font-size: clamp(56px, 17vw, 104px);
    font-weight: 200;
    letter-spacing: 0.01em;
    z-index: 1;
  }
  .flash #timeText { animation: pulse 0.9s ease-out; }
  @keyframes pulse {
    0% { color: var(--accent); transform: scale(1); }
    30% { transform: scale(1.08); }
    100% { color: var(--ink); transform: scale(1); }
  }

  /* ---- presets ---- */
  #presets {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
  }
  .preset {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid transparent;
    border-radius: 999px;
    padding: 12px 18px;
    min-width: 64px;
    cursor: pointer;
  }
  .preset.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .preset:active { transform: scale(0.95); }

  #customRow {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  #customRow.open { display: flex; }
  #customRow input {
    width: 110px;
    font-size: 20px;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid var(--ring-track);
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  #customRow input:focus { border-color: var(--accent); }
  #customRow label { color: var(--muted); font-size: 15px; }
  #customSet {
    font-size: 16px; font-weight: 600;
    background: var(--accent); color: #1c1608;
    border: none; border-radius: 12px;
    padding: 11px 18px; cursor: pointer;
  }

  /* ---- controls ---- */
  #controls { display: flex; align-items: center; gap: 22px; }
  #startBtn {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--accent);
    color: #1c1608;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(232, 176, 75, 0.35);
  }
  #startBtn.running { background: var(--card); color: var(--accent); box-shadow: none; border: 1.5px solid var(--accent); }
  #startBtn:active { transform: scale(0.95); }
  #resetBtn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1.5px solid var(--ring-track);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #resetBtn:active { transform: scale(0.95); }

  footer { font-size: 12px; color: var(--muted); opacity: 0.7; min-height: 16px; text-align: center; }

  .section { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<header>
  <h1>Practice Timer</h1>
  <div id="cycle">&nbsp;</div>
</header>

<div id="dialWrap">
  <svg id="dial" viewBox="0 0 100 100">
    <circle id="track" cx="50" cy="50" r="46"></circle>
    <circle id="progress" cx="50" cy="50" r="46"></circle>
  </svg>
  <div id="timeText">2:00</div>
</div>

<div class="section">
  <div id="presets">
    <button class="preset" data-min="1">1</button>
    <button class="preset" data-min="1.5">1½</button>
    <button class="preset active" data-min="2">2</button>
    <button class="preset" data-min="3">3</button>
    <button class="preset" data-min="5">5</button>
    <button class="preset" id="customBtn">⋯</button>
  </div>
  <div id="customRow">
    <input id="customInput" type="number" inputmode="decimal" min="0.1" max="120" step="0.5" placeholder="2.5">
    <label for="customInput">min</label>
    <button id="customSet">Set</button>
  </div>
</div>

<div id="controls">
  <button id="resetBtn">Reset</button>
  <button id="startBtn">Start</button>
</div>

<footer id="hint">Screen stays awake while the timer runs</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const timeText = $('timeText'), progress = $('progress'), cycleEl = $('cycle');
  const startBtn = $('startBtn'), resetBtn = $('resetBtn');
  const presetsEl = $('presets'), customBtn = $('customBtn');
  const customRow = $('customRow'), customInput = $('customInput'), customSet = $('customSet');
  const dialWrap = $('dialWrap'), hint = $('hint');

  const CIRC = 2 * Math.PI * 46;
  progress.style.strokeDasharray = CIRC;

  let durationMs = 2 * 60000;
  let endTime = 0;          // epoch ms when current cycle ends
  let running = false;
  let cycle = 0;
  let tickId = null;
  let wakeLock = null;
  let audioCtx = null;

  // ---- restore last duration ----
  try {
    const saved = parseFloat(localStorage.getItem('pt-minutes'));
    if (saved > 0 && saved <= 120) setDuration(saved, false);
  } catch (e) {}

  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60), s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function render(remaining) {
    timeText.textContent = fmt(remaining);
    const frac = durationMs > 0 ? Math.max(0, remaining / durationMs) : 0;
    progress.style.strokeDashoffset = CIRC * (1 - frac);
  }

  function setDuration(minutes, save = true) {
    durationMs = Math.round(minutes * 60000);
    if (save) { try { localStorage.setItem('pt-minutes', minutes); } catch (e) {} }
    document.querySelectorAll('.preset').forEach(b => {
      b.classList.toggle('active', parseFloat(b.dataset.min) === minutes);
    });
    if (!running) render(durationMs);
  }

  // ---- chime: soft two-note bell via Web Audio ----
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function strike(freq, when, gainPeak, dur) {
    const partials = [1, 2.76, 5.4];   // bell-like overtones
    const amps = [1, 0.28, 0.08];
    partials.forEach((p, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * p;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gainPeak * amps[i], when + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(when);
      osc.stop(when + dur + 0.05);
    });
  }

  function chime() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.02;
    strike(660, t, 0.22, 1.6);          // E5
    strike(880, t + 0.45, 0.22, 2.0);   // A5
  }

  // ---- wake lock ----
  async function acquireWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else {
        hint.textContent = 'Wake Lock unsupported — keep the screen on manually';
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (running && document.visibilityState === 'visible') {
      acquireWakeLock();
      tick(); // catch up display immediately
    }
  });

  // ---- timer core (timestamp-based, drift-free) ----
  function tick() {
    if (!running) return;
    const remaining = endTime - Date.now();
    if (remaining <= 0) {
      cycle++;
      cycleEl.textContent = 'Cycle ' + (cycle + 1);
      chime();
      dialWrap.classList.remove('flash');
      void dialWrap.offsetWidth;   // restart animation
      dialWrap.classList.add('flash');
      endTime = Date.now() + durationMs;   // auto-reset & repeat
      render(durationMs);
    } else {
      render(remaining);
    }
  }

  function start() {
    ensureAudio();          // must happen inside the tap gesture for iOS
    running = true;
    cycle = 0;
    cycleEl.textContent = 'Cycle 1';
    endTime = Date.now() + durationMs;
    startBtn.textContent = 'Pause';
    startBtn.classList.add('running');
    acquireWakeLock();
    tickId = setInterval(tick, 200);
    tick();
  }

  function pause() {
    running = false;
    durationRemainingOnPause = endTime - Date.now();
    clearInterval(tickId);
    startBtn.textContent = 'Resume';
    startBtn.classList.remove('running');
    releaseWakeLock();
  }

  let durationRemainingOnPause = 0;
  function resume() {
    ensureAudio();
    running = true;
    endTime = Date.now() + Math.max(500, durationRemainingOnPause);
    startBtn.textContent = 'Pause';
    startBtn.classList.add('running');
    acquireWakeLock();
    tickId = setInterval(tick, 200);
    tick();
  }

  function reset() {
    running = false;
    clearInterval(tickId);
    cycle = 0;
    cycleEl.innerHTML = '&nbsp;';
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    releaseWakeLock();
    render(durationMs);
  }

  startBtn.addEventListener('click', () => {
    if (running) pause();
    else if (startBtn.textContent === 'Resume') resume();
    else start();
  });
  resetBtn.addEventListener('click', reset);

  presetsEl.addEventListener('click', e => {
    const btn = e.target.closest('.preset');
    if (!btn) return;
    if (btn === customBtn) {
      customRow.classList.toggle('open');
      if (customRow.classList.contains('open')) customInput.focus();
      return;
    }
    customRow.classList.remove('open');
    const mins = parseFloat(btn.dataset.min);
    setDuration(mins);
    if (running || startBtn.textContent === 'Resume') {
      // switching duration mid-session restarts the cycle cleanly
      reset();
    }
  });

  customSet.addEventListener('click', () => {
    const mins = parseFloat(customInput.value);
    if (!(mins > 0) || mins > 120) { customInput.value = ''; return; }
    setDuration(mins);
    customBtn.classList.add('active');
    customRow.classList.remove('open');
    customInput.blur();
    if (running || startBtn.textContent === 'Resume') reset();
  });
  customInput.addEventListener('keydown', e => { if (e.key === 'Enter') customSet.click(); });

  render(durationMs);
})();
</script>
</body>
</html>
